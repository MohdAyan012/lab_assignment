<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Model</title>
<style>
  .box { width: 200px; padding: 20px; border: 5px solid #333; margin-bottom: 15px; background: #eef; }
  .content { box-sizing: content-box; }
  .border { box-sizing: border-box; }
</style>
</head>
<body>
<div class="box content">content-box (total width 250px)</div>
<div class="box border">border-box (total width 200px)</div>
</body>
